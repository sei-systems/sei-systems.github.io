<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discovery Gateway | SEI Systems</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sjcl/1.0.8/sjcl.min.js"></script>
</head>
<body>
    <header class="sei-header">
        <nav class="sei-nav">
            <a href="index.html" class="sei-nav-link">Home</a>
            <a href="labs.html" class="sei-nav-link">Labs</a>
            <a href="privacy.html" class="sei-nav-link">Compliance</a>
            <a href="discovery.html" class="sei-nav-link active">Unlock Potential</a>
        </nav>
        <h1 class="sei-title">Unlock <span class="sei-highlight">Potential</span></h1>
    </header>

    <main class="sei-container">
        <div class="gateway-grid">
            <div class="discovery-form">
                <form id="discoveryGatewayForm">
                    <div class="form-group"><label>Contact Name</label><input type="text" id="contact_name" class="form-input" required></div>
                        <div class="form-group"><label>Company Name</label><input type="text" id="company_name" class="form-input" required></div>
                        <div class="form-group">
                            <label>Employee Count</label>
                            <select id="employee_count" class="form-input">
                                <option value="1-20">1-20 Employees</option>
                                <option value="21-100">21-100 Employees</option>
                                <option value="101+">101+ Employees</option>
                            </select>
                        </div>
                        <div class="form-group"><label>Tech Stack</label><input type="text" id="tech_stack" class="form-input" placeholder="e.g., Mendix, AWS"></div>
                        <div class="form-group"><label>Primary Bottleneck</label><textarea id="bottleneck" class="form-input" rows="3"></textarea></div>
                        <button type="submit" class="sei-btn-action" style="width: 100%;">Initialize Roadmap</button>
                </form>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('discoveryGatewayForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const secret = "sei_systems_secure_gateway_01";
            const fullPayload = {
                source_system: "SENTRY-WEB-GATEWAY",
                event_id: crypto.randomUUID(),
                timestamp_utc: new Date().toISOString(),
                contact_name: document.getElementById('contact_name').value,
                company_name: document.getElementById('company_name').value,
                employee_count: document.getElementById('employee_count').value,
                bottleneck: document.getElementById('bottleneck').value,
                tech_stack: document.getElementById('tech_stack').value
            };

            const bodyString = JSON.stringify(fullPayload);
            const hmac = new sjcl.misc.hmac(sjcl.codec.utf8String.toBits(secret), sjcl.hash.sha256);
            const signature = sjcl.codec.hex.fromBits(hmac.encrypt(bodyString));

            await fetch('https://crm315-sandbox.mxapps.io/rest/IncomingLead/v1/prospectiveLead', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-SEI-Signature': signature },
                body: bodyString
            });
            alert("Roadmap Initialized.");
        });
    </script>
</body>
</html>
