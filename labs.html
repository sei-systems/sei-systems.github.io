<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Labs | AI Security & SOC 2 Audit Demos</title>
    <meta name="description" content="Explore live technical demonstrations of AI-driven compliance auditing and process velocity benchmarking for SOC 2 systems.">
    <link rel="canonical" href="https://www.seisystems.co/labs.html" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="sei-header">
        <nav class="sei-nav">
            <a href="index.html" class="sei-nav-link">Home</a>
            <a href="labs.html" class="sei-nav-link active">Labs</a>
            <a href="privacy.html" class="sei-nav-link">Compliance</a>
            <a href="discovery.html" class="sei-nav-link">Unlock Potential</a>
        </nav>
        <h1 class="sei-title">Security <span class="sei-highlight">Labs</span></h1>
        <p>Live demonstrations of SOC 2-compliant AI governance.</p>
    </header>

    <main class="sei-container">
        <div class="sei-card">
            <h3>Lab 01: The Audit Haystack</h3>
            <p>Testing AI pattern recognition against 500 lines of raw system logs.</p>
            <button class="sei-btn-action" onclick="generateLogs()">Generate Logs</button>
            <div id="log-terminal" class="terminal-window" style="margin-top:1rem;">Ready...</div>
        </div>
    </main>

    <script>
        function generateLogs() {
            const term = document.getElementById('log-terminal');
            term.innerHTML = "Initializing stream...<br>";
            setTimeout(() => {
                term.innerHTML += `[${new Date().toISOString()}] <span style="color: #ff4b2b;">CRITICAL: Unauthorized Access DB_PROD</span><br>`;
                term.innerHTML += `[${new Date().toISOString()}] INFO: Sentry AI isolated threat.`;
            }, 500);
        }
    </script>
</body>
</html>
