<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Labs | SEI Systems</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .terminal-window {
            background: #050505;
            color: #00ff41; /* Classic Matrix/Security Green */
            font-family: 'Courier New', monospace;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #222;
            height: 300px;
            overflow-y: auto;
            font-size: 0.85rem;
            margin-top: 1rem;
        }
        .audit-report { display: none; }
    </style>
</head>
<body>
    <header class="sei-header">
        <nav class="sei-nav">
            <a href="index.html" class="sei-nav-link">Home</a>
            <a href="labs.html" class="sei-nav-link active">Labs</a>
            <a href="privacy.html" class="sei-nav-link">Compliance</a>
            <a href="discovery.html" class="sei-nav-link">Unlock Potential</a>
        </nav>
        <h1 class="sei-title">Security <span class="sei-highlight">Labs</span></h1>
        <p>Live demonstrations of SOC 2-compliant AI governance.</p>
    </header>

    <main class="sei-container">
        <div class="sei-card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <span class="sei-badge">Lab 01</span>
                    <h2 style="color: var(--white);">The Audit Haystack</h2>
                </div>
                <div>
                    <button class="sei-btn-action" id="gen-btn" onclick="generateLogs()">Generate Logs</button>
                </div>
            </div>
            
            <div id="log-terminal" class="terminal-window">System Ready. Awaiting log generation...</div>
            
            <div id="audit-actions" style="margin-top: 1rem; display:none;">
                <button class="sei-btn-action" onclick="simulateAudit()">Run AI Audit Analysis</button>
            </div>

            <div id="report-output" class="audit-report">
                </div>
        </div>
    </main>

    <footer style="text-align: center; padding: 4rem; border-top: 1px solid #222; font-size: 0.8rem;">
        <p>&copy; 2026 SEI Systems. All Systems Operational.</p>
    </footer>

    <script>
        // Use your existing generateLogs() and simulateAudit() functions here.
        // I recommend adding a "loading" state to simulate the AI "thinking"
        function simulateAudit() {
            const terminal = document.getElementById('log-terminal');
            terminal.innerHTML += "<br>[SYSTEM]: AI Agent Sentry-Alpha initializing scan...";
            
            setTimeout(() => {
                document.getElementById('audit-actions').style.display = 'none';
                document.getElementById('report-output').style.display = 'block';
                document.getElementById('report-output').innerHTML = `
                    <div class="security-banner" style="border-color: var(--blue);">
                        <h3 style="color: var(--white); margin-top: 0;">Automated Audit Report</h3>
                        <p>Sentry AI has identified 3 anomalies against SOC 2 CC6.1 controls.</p>
                        <button class="sei-btn-action" style="font-size: 0.7rem;" onclick="location.reload()">Reset Lab</button>
                    </div>
                `;
            }, 1500);
        }
    </script>
</body>
</html>
